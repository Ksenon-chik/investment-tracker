<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | Investment Tracker</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="auth-body">

<div class="card auth-card">
    <h2 style="text-align:center; margin-bottom: 25px;">Investment Tracker</h2>

    <div class="tabs">
        <div class="tab active" id="login-tab" onclick="showLogin()">Вход</div>
        <div class="tab" id="register-tab" onclick="showRegister()">Регистрация</div>
    </div>

    {% if request.query_params.get("error") %}
        <div class="error-msg">{{ request.query_params.get("error") }}</div>
    {% endif %}

    <form id="login-form" method="post" action="/auth/login-form">
        <div class="form-group">
            <input name="email" type="email" placeholder="Email" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="Пароль" required>
        </div>
        <button class="btn">Войти</button>
    </form>

    <form id="register-form" method="post" action="/auth/register" style="display:none;" onsubmit="return validateRegister()">
        <div class="form-group">
            <input name="email" type="email" placeholder="Email" required>
        </div>
        <div class="form-group">
            <input type="password" id="reg-password" name="password" placeholder="Пароль" required>
        </div>
        <div class="form-group">
            <input type="password" id="reg-confirm" name="confirm_password" placeholder="Повторите пароль" required>
        </div>
        <div class="form-group">
            <input type="number" step="any" id="start-balance" name="start_balance" placeholder="Начальный баланс" required>
        </div>
        <button class="btn">Создать аккаунт</button>
    </form>
</div>

<script src="/static/js/auth.js"></script>
</body>
</html>
