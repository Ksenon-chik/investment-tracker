<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Трейдинг дневник</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            padding: 0 80px;
            position: relative; /* ✅ важно */
        }

        /* ✅ ЛИНИЯ ЧЕРЕЗ ВЕСЬ ЭКРАН */
        .top-line {
            position: absolute;
            top: 120px;
            left: 80px;
            right: 80px;
            height: 2px;
            background: #7b2ff7;
        }

        .left {
            max-width: 500px;
        }

        h1 {
            font-size: 42px;
            font-weight: bold;
        }

        p {
            color: #aaa;
            margin-top: 20px;
        }

        .buttons {
            margin-top: 40px;
        }

        .btn {
            padding: 35px 120px;
            border-radius: 40px;
            font-size: 22px;
            cursor: pointer;
            margin-right: 20px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-login {
            border: 1px solid #888;
            color: white;
        }

        .btn-register {
            background: linear-gradient(90deg, #7b2ff7, #9b00ff);
            color: white;
        }

        .right {
            text-align: center;
            position: relative;
            top: -120px;
        }

        .big-btn {
            padding: 40px 90px;
            border-radius: 40px;
            font-size: 22px;
            background: linear-gradient(90deg, #7b2ff7, #9b00ff);
            color: white;
            text-decoration: none;
        }

        .line {
            height: 2px;
            background: #7b2ff7;
            margin-top: 30px;
        }

        .purple-line {
            height: 2px;
            background: #7b2ff7;
            margin: 30px 0;
        }

        /* ✅ линии вокруг кнопки */
        .register-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .register-line {
            flex: 1;
            height: 2px;
            background: #7b2ff7;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ✅ ГЛОБАЛЬНАЯ ЛИНИЯ -->
    <div class="top-line"></div>

    <div class="left">

        <h1>ТВОЙ ЛИЧНЫЙ<br>ДНЕВНИК ТРЕЙДЕРА</h1>

        <div class="purple-line"></div>

        <p>
            Автоматический учёт, глубокая аналитика и контроль эмоций.<br>
            Улучшай свои результаты каждый день
        </p>

        <div class="buttons">
            <a href="/auth-page?mode=login" class="btn btn-login">Вход</a>
        </div>

        <div class="line"></div>
    </div>

    <div class="right">

        <div class="register-wrapper">

            <div class="register-line"></div>

            <a href="/auth-page?mode=register" class="big-btn">
                Регистрация
            </a>

            <div class="register-line"></div>

        </div>

    </div>

</div>

</body>
</html>
