<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аналитика | Investment Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar">
    <div class="menu-top">
        <h3>Tracker</h3>
        <a href="/profile">Профиль</a>
        <a href="/deals">Сделки</a>
        <a href="/analytics" class="active">Аналитика</a>
    </div>

    <div class="menu-bottom">
        <a href="/" class="logout-btn">Выйти</a>
    </div>
</div>

<div class="main">
    <h2>Сводная аналитика</h2>

    <div class="stats-grid">
        <div class="card">
            <h3>Всего сделок</h3>
            <p class="stat-value">{{ total_deals }}</p>
        </div>
        <div class="card">
            <h3>Общая прибыль</h3>
            <p class="stat-value val-profit">{{ total_profit }}</p>
        </div>
        <div class="card">
            <h3>Общий убыток</h3>
            <p class="stat-value val-loss">{{ total_loss }}</p>
        </div>
        <div class="card">
            <h3>Winrate</h3>
            <p class="stat-value val-accent">{{ winrate }}%</p>
        </div>
    </div>

    <div class="charts-grid">
        <div class="card chart-card">
            <h3>Динамика капитала</h3>
            <div class="chart-container">
                <canvas id="profitChart"></canvas>
            </div>
        </div>

        <div class="card chart-card">
            <h3>Доли активов</h3>
            <div class="chart-container">
                <canvas id="assetsChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card chart-card" style="margin-top: 20px; min-height: 300px;">
        <h3>Активность по дням недели</h3>
        <div class="chart-container">
            <canvas id="weekChart"></canvas>
        </div>
    </div>
</div>

<script>
    window.chartData = {{ chart_data | tojson | safe }};
    window.assetsData = {{ assets_data | tojson | safe }};
    window.weekData = {{ week_data | tojson | safe }};
</script>

<script src="{{ url_for('static', path='/js/analytics.js') }}"></script>

</body>
</html>
