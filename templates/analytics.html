<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика | Investment Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar">
    <div class="menu-top">
        <h3>Tracker</h3>
        
        <a href="/profile">
            <i class="fa-regular fa-user"></i> <span>Профиль</span>
        </a>
        
        <a href="/deals">
            <i class="fa-solid fa-chart-line"></i> <span>Сделки</span>
        </a>
        
        <a href="/analytics" class="active">
            <i class="fa-solid fa-chart-pie"></i> <span>Аналитика</span>
        </a>
    </div>

    <div class="menu-bottom">
        <a href="/" class="logout-btn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> <span>Выйти</span>
        </a>
    </div>
</div>

<div class="main">
    <h2>Сводная аналитика</h2>

    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px;">
        <div class="card">
            <h3>Всего сделок</h3>
            <p class="stat-value">{{ total_deals }}</p>
        </div>
        <div class="card">
            <h3>Общая прибыль</h3>
            <p class="stat-value val-profit">{{ total_profit }}</p>
        </div>
        <div class="card">
            <h3>Общий убыток</h3>
            <p class="stat-value val-loss">{{ total_loss }}</p>
        </div>
        <div class="card">
            <h3>Winrate</h3>
            <p class="stat-value val-accent">{{ winrate }}%</p>
        </div>
    </div>

    <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="card">
            <h3>Динамика капитала</h3>
            <div class="chart-container" style="height: 300px; position: relative;">
                <canvas id="profitChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>Доли активов</h3>
            <div class="chart-container" style="height: 300px; position: relative;">
                <canvas id="assetsChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h3>Активность по дням недели</h3>
        <div class="chart-container" style="height: 300px; position: relative;">
            <canvas id="weekChart"></canvas>
        </div>
    </div>
</div>

<script>
    window.chartData = {{ chart_data | tojson | safe }};
    window.assetsData = {{ assets_data | tojson | safe }};
    window.weekData = {{ week_data | tojson | safe }};
</script>

<script src="{{ url_for('static', path='/js/analytics.js') }}"></script>

</body>
</html>
