<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аналитика | Investment Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary-bg: #121212;
            --card-bg: #1e1e1e;
            --accent: #7b2ff7;
            --accent-hover: #9b00ff;
            --text-main: #ffffff;
            --text-muted: #aaa;
            --border-color: #333;
            --success: #00ff7f;
            --danger: #ff4d4d;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--primary-bg);
            color: var(--text-main);
            display: flex;
        }

        /* SIDEBAR - Точно как в профиле */
        .sidebar {
            width: 261px;
            background: var(--card-bg);
            height: 100vh;
            padding: 30px 20px;
            border-right: 1px solid var(--border-color);
            position: fixed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .logout-btn {
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 15px;
            transition: 0.3s;
        }

        .sidebar h3 { font-size: 24px; margin-bottom: 40px; text-align: center; }

        .sidebar a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin: 10px 0;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .sidebar a:hover, .sidebar a.active {
            background: rgba(123, 47, 247, 0.1);
            color: var(--accent);
        }

        /* MAIN CONTENT */
        .main {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            max-width: 1200px;
        }

        h2 { margin-bottom: 30px; font-weight: 600; letter-spacing: -0.5px; }

        /* СЕТКА КАРТОЧЕК СТАТИСТИКИ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: border-color 0.3s;
        }

        .card:hover { border-color: var(--accent); }

        .card h3 { 
            margin: 0 0 10px 0; 
            font-size: 0.85em; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            letter-spacing: 1px;
        }

        .stat-value { font-size: 1.8em; font-weight: bold; margin: 0; }

        /* СЕТКА ГРАФИКОВ */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .chart-card { min-height: 350px; display: flex; flex-direction: column; }
        .chart-container { flex: 1; position: relative; margin-top: 15px; }

        /* ЦВЕТА СТАТИСТИКИ */
        .val-profit { color: var(--success); }
        .val-loss { color: var(--danger); }
        .val-accent { color: var(--accent); }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="menu-top">
        <h3>Tracker</h3>
        <a href="/profile">Профиль</a>
        <a href="/deals">Сделки</a>
        <a href="/analytics">Аналитика</a>
    </div>

    <div class="menu-bottom">
        <a href="/" class="logout-btn">Выйти</a>
    </div>
</div>

<div class="main">
    <h2>Сводная аналитика</h2>

    <div class="stats-grid">
        <div class="card">
            <h3>Всего сделок</h3>
            <p class="stat-value">{{ total_deals }}</p>
        </div>
        <div class="card">
            <h3>Общая прибыль</h3>
            <p class="stat-value val-profit">{{ total_profit }}</p>
        </div>
        <div class="card">
            <h3>Общий убыток</h3>
            <p class="stat-value val-loss">{{ total_loss }}</p>
        </div>
        <div class="card">
            <h3>Winrate</h3>
            <p class="stat-value val-accent">{{ winrate }}%</p>
        </div>
    </div>

    <div class="charts-grid">
        <div class="card chart-card">
            <h3 style="color: var(--accent); text-transform: none; font-size: 1.1em;">Динамика капитала</h3>
            <div class="chart-container">
                <canvas id="profitChart"></canvas>
            </div>
        </div>

        <div class="card chart-card">
            <h3 style="color: var(--accent); text-transform: none; font-size: 1.1em;">Доли активов</h3>
            <div class="chart-container">
                <canvas id="assetsChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card chart-card" style="margin-top: 20px; min-height: 300px;">
        <h3 style="color: var(--accent); text-transform: none; font-size: 1.1em;">Активность по дням недели</h3>
        <div class="chart-container">
            <canvas id="weekChart"></canvas>
        </div>
    </div>
</div>

<script>
const purple = "#7b2ff7";
const gridColor = "rgba(255, 255, 255, 0.05)";
const textColor = "#777";

Chart.defaults.color = textColor;
Chart.defaults.font.family = "'Segoe UI', sans-serif";

/* ===== ГРАФИК КАПИТАЛА ===== */
const rawData = {{ chart_data | tojson | safe }};
const ctx = document.getElementById("profitChart"); // ID из твоего HTML

if (ctx) {
    new Chart(ctx, {
        type: "line",
        data: {
            labels: rawData.map(d => d.date),
            datasets: [{
                label: "Баланс",
                data: rawData.map(d => d.balance),
                borderColor: "#7b2ff7",
                backgroundColor: "rgba(123, 47, 247, 0.1)",
                borderWidth: 3,
                pointRadius: 5,
                pointBackgroundColor: "#7b2ff7",
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: { ticks: { color: "#777" }, grid: { display: false } },
                y: { 
                    ticks: { color: "#777" }, 
                    grid: { color: "#222" } 
                    // Здесь НЕТ beginAtZero, поэтому он будет как в профиле
                }
            }
        }
    });
}

/* ===== КРУГОВОЙ ГРАФИК АКТИВОВ ===== */
const assetsData = {{ assets_data | tojson }};
new Chart(document.getElementById("assetsChart"), {
    type: "doughnut",
    data: {
        labels: Object.keys(assetsData),
        datasets: [{
            data: Object.values(assetsData),
            backgroundColor: ["#7b2ff7", "#9b00ff", "#5a1fd7", "#3b0ca3", "#1a1a1a"],
            borderWidth: 0,
            hoverOffset: 10
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { position: 'bottom', labels: { padding: 20, color: '#aaa' } }
        },
        cutout: '70%'
    }
});

/* ===== СДЕЛКИ ПО ДНЯМ ===== */
const weekData = {{ week_data | tojson }};
const orderedDays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const orderedValues = orderedDays.map(day => weekData[day] || 0);

new Chart(document.getElementById("weekChart"), {
    type: "bar",
    data: {
        labels: orderedDays,
        datasets: [{
            data: orderedValues,
            backgroundColor: purple,
            borderRadius: 8,
            barThickness: 40
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1 } }
        }
    }
});
</script>

</body>
</html>
